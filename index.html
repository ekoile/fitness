<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LiftLog</title>
  <meta name="description" content="Offline workout planner and exercise logger with deload weeks, warm-ups, rest timer and CSV export.">
  <meta name="theme-color" content="#f6f6f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LiftLog">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="main" aria-live="polite">
    <p class="muted center" style="padding-top:40vh">Loading…</p>
  </main>

  <div id="restbar" class="restbar" hidden>
    <div class="rest-progress"><span></span></div>
    <div class="rest-inner">
      <div><small>Rest</small><span class="rest-time">0:00</span></div>
      <button type="button" class="btn small ghost-on-dark" data-act="rest-sub">−15s</button>
      <button type="button" class="btn small ghost-on-dark" data-act="rest-add">+30s</button>
      <button type="button" class="btn small light" data-act="rest-skip">Skip</button>
    </div>
  </div>

  <div id="countdown" class="countdown" hidden role="dialog" aria-modal="true" aria-label="Set timer">
    <div class="cd-box">
      <p class="cd-title"></p>
      <p class="cd-time">0:00</p>
      <p class="cd-sub"></p>
      <div class="cd-progress"><span></span></div>
      <div class="cd-actions">
        <button type="button" class="btn big" data-act="cd-pause">Pause</button>
        <button type="button" class="btn primary big" data-act="cd-done">Done</button>
      </div>
      <button type="button" class="btn ghost block" data-act="cd-cancel">Cancel</button>
    </div>
  </div>

  <div id="metro" class="countdown metro-sheet" hidden role="dialog" aria-label="Metronome">
    <div class="cd-box" id="metro-box"></div>
  </div>

  <div id="metro-pill" class="metro-pill" hidden>
    <button type="button" class="pill-main" data-act="metro-open">♩ <span></span></button>
    <button type="button" class="pill-stop" data-act="metro-stop" aria-label="Stop metronome">Stop</button>
  </div>

  <div id="toast" class="toast" hidden role="status"></div>
  <nav id="tabs" class="tabs" aria-label="Sections"></nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
